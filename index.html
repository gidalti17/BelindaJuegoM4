<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELINDA CORE: PROTOCOLO ATMOSFÉRICO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video autoplay muted loop id="video-bg">
        <source src="contaminacion.mp4" type="video/mp4">
        </video>

    <div id="game-wrapper">
        <div id="intro-screen">
            <h1 class="glitch">BELINDA CORE</h1>
            <div class="info-box">
                <h2 class="progression-title">Progresión 14: La Química del Aire</h2>
                <p class="progression-desc">
                    <b>Misión:</b> Analizar la composición de la atmósfera, identificar contaminantes primarios y secundarios, 
                    y proponer soluciones para mejorar la calidad del aire que respiramos.
                </p>
            </div>
            <button class="neon-btn" onclick="game.start()">
                INICIAR PROTOCOLO
            </button>
        </div>

        <div id="game-ui" class="hidden">
            <div class="hud">
                <div class="stat-box">ESTADO: <span style="color:var(--neon-green)">OPERATIVO</span></div>
                <div class="stat-box">ACIERTOS: <span id="score">0</span></div>
                <div class="stat-box">TIEMPO: <span id="time-text">0s</span></div>
            </div>
            <div id="timer-bar"><div id="timer-fill"></div></div>
            <h2 id="stage-title"></h2>
            <div id="game-container"></div>
        </div>
    </div>

    <div id="overlay" class="hidden">
        <div class="modal">
            <h2 id="modal-title"></h2>
            <div id="modal-content"><p id="modal-text"></p></div>
            <button class="neon-btn">CONTINUAR</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
