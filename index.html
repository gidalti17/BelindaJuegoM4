<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELINDA CORE: PROTOCOLO QUÍMICO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div id="game-wrapper">
        <div id="intro-screen">
            <h1 class="glitch">BELINDA CORE</h1>
            <div class="info-box">
                <h2 class="progression-title">Progresión 14.</h2>
                <p class="progression-desc">
                    La ciencia como un esfuerzo humano para el bienestar, parte 4. 
                    La química del aire ¿Cómo mejorar lo que respiramos?
                </p>
            </div>
            <button class="neon-btn" onclick="game.start()">INICIAR PROTOCOLO</button>
        </div>

        <div id="game-ui" class="hidden">
            <div class="hud">
                <div class="stat-box">ESTADO: <span style="color:white">OPERATIVO</span></div>
                <div class="stat-box">ACIERTOS: <span id="score" style="color:white">0</span></div>
                <div class="stat-box">TIEMPO: <span id="time-text" style="color:white">0s</span></div>
            </div>
            <div id="timer-bar"><div id="timer-fill"></div></div>
            <h2 id="stage-title" style="color: var(--neon-blue); text-align: center;"></h2>
            <div id="game-container"></div>
        </div>
    </div>

    <div id="overlay" class="hidden">
        <div class="modal">
            <h2 id="modal-title"></h2>
            <p id="modal-text"></p>
            <button class="neon-btn" onclick="game.nextStage()">CONTINUAR</button>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Protocolo Offline: Activado'))
                    .catch(err => console.log('Error de registro:', err));
            });
        }
    </script>
</body>
</html>
